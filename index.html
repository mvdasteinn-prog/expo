<style>
  :root {
    --bg: #14110f; --fg: #f2ebe0; --muted: #9c9185; --accent: #ff7a4d; --line: rgba(242,235,224,.18);
    --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Cormorant Garamond", Georgia, serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent;
  }
  header { text-align: center; padding-block: 8px 0; }
  header h1 { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 1.8rem; margin: 0; line-height: 1.05; }
  header p { margin: 3px 0 0; color: var(--muted); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }

  .stage { position: relative; width: 100%; max-width: 400px; aspect-ratio: 9 / 16; max-height: 62dvh; background: #000; overflow: hidden; border-radius: 6px; box-shadow: 0 24px 60px rgba(0,0,0,.6); transition: aspect-ratio .2s; }
  .stage.post { aspect-ratio: 4 / 5; }
  .stage video, .stage canvas, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage video.mirror { transform: scaleX(-1); }
  .stage canvas { pointer-events: none; }
  .stage .hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #fff; font-family: var(--display); font-style: italic; font-size: 1.2rem; background: rgba(0,0,0,.5); }

  .controls { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; background: transparent; color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg .chip { border: 0; padding: 5px 12px; }
  button.btn { font: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 13px 16px; background: transparent; color: var(--fg); }
  button.primary { background: var(--accent); color: #1a0d07; border-color: var(--accent); flex: 1; }
  button.icon { width: 46px; padding: 12px 0; flex: none; }
  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; }
  .status { color: var(--muted); font-size: .78rem; text-align: center; min-height: 1.2em; }
  [hidden] { display: none !important; }
  footer { color: var(--muted); font-size: .72rem; text-align: center; padding-block: 2px 12px; max-width: 400px; }
</style>

<body>

<header>
  <h1 id="expoName">Lala</h1>
  <p id="expoMeta">Elige tu marco · toma la foto · compártela</p>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline autoplay muted></video>
  <img id="result" alt="Tu foto con el marco" hidden>
  <canvas id="overlay"></canvas>
  <div class="hint" id="hint">Permite el acceso a la cámara para ver el marco</div>
</div>

<div class="controls">
  <div class="chips" id="styles" role="group" aria-label="Estilo del marco"></div>
  <div class="row" id="liveControls">
    <div class="seg" role="group" aria-label="Formato">
      <button class="chip" data-format="story" aria-pressed="true">Story 9:16</button>
      <button class="chip" data-format="post" aria-pressed="false">Post 4:5</button>
    </div>
    <span style="flex:1"></span>
    <button class="btn icon" id="flip" title="Cambiar cámara" aria-label="Cambiar cámara">⟲</button>
  </div>
  <div class="row" id="liveActions">
    <button class="btn primary" id="shoot">Tomar foto</button>
    <button class="btn" id="pick">Subir foto</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
  <div class="row" id="resultActions" hidden>
    <button class="btn primary" id="share">Compartir</button>
    <button class="btn" id="save">Guardar</button>
    <button class="btn" id="again">Otra</button>
  </div>
  <div class="status" id="status"></div>
</div>
<footer>Si Guardar no descarga, mantén presionada la imagen y elige "Guardar en Fotos".</footer>

/* Pseudo-aleatorio con semilla: las pinceladas quedan iguales en el preview y en la foto final. */
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const font = (fam, size, w = 400, it = "") => `${it} ${w} ${size}px "${fam}", sans-serif`;
/* Reduce el tamaño de fuente hasta que el texto quepa en maxW */
function fit(ctx, text, maxW, fam, size, w = 400, it = "") { let f = size; ctx.font = font(fam, f, w, it); while (ctx.measureText(text).width > maxW && f > 12) { f -= 2; ctx.font = font(fam, f, w, it); } }

/* Dibuja la firma con ancho w, anclada según align (left|center|right) en (x,y) = esquina inferior, en el color dado */
function sign(ctx, x, y, w, color, align = "left", angle = 0) {
  if (!SIG.complete || !SIG.naturalWidth) return;
  const h = w * SIG.naturalHeight / SIG.naturalWidth;
  const off = document.createElement("canvas"); off.width = Math.ceil(w); off.height = Math.ceil(h);
  const o = off.getContext("2d"); o.drawImage(SIG, 0, 0, w, h); o.globalCompositeOperation = "source-in"; o.fillStyle = color; o.fillRect(0, 0, w, h);
  const dx = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
  ctx.save(); ctx.translate(dx + w / 2, y - h / 2); ctx.rotate(angle); ctx.drawImage(off, -w / 2, -h / 2); ctx.restore();
}


/* Pie común de los marcos temáticos: firma dentro de la foto (abajo a la derecha) y textos en la banda inferior */
function footer(ctx, W, H, m, bot, c1, c2, sigColor) {
  const s = W / 1080;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10 * s; sign(ctx, W - m - 28 * s, bot - 28 * s, 230 * s, sigColor, "right"); ctx.restore();
  ctx.fillStyle = c1; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  stack(ctx, CONFIG.expoLines.map(l => l.toUpperCase()), m, bot + 235 * s, W - 2 * m, "Cormorant Garamond", 72 * s, 600, "", .96);
  ctx.font = font("IBM Plex Sans", 28 * s, 500); ctx.fillText(CONFIG.date, m, bot + 300 * s);
  ctx.fillStyle = c2; const f = `${CONFIG.place} · ${CONFIG.handle}`; fit(ctx, f, W - 2 * m, "IBM Plex Sans", 22 * s); ctx.fillText(f, m, bot + 345 * s);
}

/* ---------- Estilos de marco. Cada uno dibuja sobre un canvas de W×H (la foto ya está debajo). ---------- */
/* Escribe varias líneas (ajusta el tamaño para que la más ancha quepa en maxW) */
function stack(ctx, lines, x, y, maxW, fam, size, w = 400, it = "", lh = 1.0) {
  let f = size; ctx.font = font(fam, f, w, it);
  while (Math.max(...lines.map(l => ctx.measureText(l).width)) > maxW && f > 12) { f -= 2; ctx.font = font(fam, f, w, it); }
  lines.forEach((l, i) => ctx.fillText(l, x, y - (lines.length - 1 - i) * f * lh));
  return f;
}

  fuego: { name: "Fuego", draw(ctx, W, H) {

/* Chips de estilo */
const stylesEl = $("styles");
Object.entries(STYLES).forEach(([id, st]) => {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = st.name; b.dataset.style = id;
  b.setAttribute("aria-pressed", id === styleId);
  b.addEventListener("click", () => { styleId = id; stylesEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); sizeOverlay(); });
  stylesEl.appendChild(b);
});
document.querySelectorAll("[data-format]").forEach(b => b.addEventListener("click", () => {
  format = b.dataset.format; document.querySelectorAll("[data-format]").forEach(c => c.setAttribute("aria-pressed", c === b));
  stage.classList.toggle("post", format === "post"); requestAnimationFrame(sizeOverlay);
}));

/* Preview en vivo */
function sizeOverlay() {
  const rect = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  overlay.width = Math.round(rect.width * dpr); overlay.height = Math.round(rect.height * dpr);
  const ctx = overlay.getContext("2d"); ctx.clearRect(0, 0, overlay.width, overlay.height);
  STYLES[styleId].draw(ctx, overlay.width, overlay.height);
}
window.addEventListener("resize", sizeOverlay);
sizeOverlay();
if (document.fonts) { document.fonts.ready.then(sizeOverlay); ["Permanent Marker", "Anton", "Caveat", "Cormorant Garamond"].forEach(f => document.fonts.load(`40px "${f}"`).then(sizeOverlay)); }

/* Cámara */
async function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices?.getUserMedia) { hint.textContent = "Este navegador no permite la cámara en vivo. Usa “Subir foto”."; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: false });
    video.srcObject = stream; video.classList.toggle("mirror", facing === "user"); await video.play();
    hint.hidden = true; $("shoot").disabled = false;
  } catch (e) { hint.hidden = false; hint.textContent = "No se pudo abrir la cámara. Revisa el permiso del navegador o usa “Subir foto”."; $("shoot").disabled = true; }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
$("flip").addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; startCamera(); });

/* Captura: foto recortada al formato + marco encima */
function compose(src, sw, sh, mirror) {
  const [W, H] = FORMATS[format];
  const c = document.createElement("canvas"); c.width = W; c.height = H; const ctx = c.getContext("2d");
  const k = Math.max(W / sw, H / sh), dw = sw * k, dh = sh * k, dx = (W - dw) / 2, dy = (H - dh) / 2;
  ctx.save(); if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); } ctx.drawImage(src, mirror ? W - dx - dw : dx, dy, dw, dh); ctx.restore();
  STYLES[styleId].draw(ctx, W, H);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}
function showResult(blob) {
  lastBlob = blob; if (result.src) URL.revokeObjectURL(result.src); result.src = URL.createObjectURL(blob);
  result.hidden = false; overlay.hidden = true; video.hidden = true; hint.hidden = true;
  $("liveControls").hidden = true; $("liveActions").hidden = true; $("styles").hidden = true; $("resultActions").hidden = false;
  stopCamera(); const [W, H] = FORMATS[format]; setStatus(`Lista para Instagram (${W} × ${H}).`);
}
$("shoot").addEventListener("click", async () => { if (video.videoWidth) showResult(await compose(video, video.videoWidth, video.videoHeight, facing === "user")); });
$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return; setStatus("Procesando…");
  // Se decodifica con <img>: funciona en todos los navegadores y respeta la orientación EXIF de la cámara
  const url = URL.createObjectURL(f);
  const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
  e.target.value = "";
  if (!img) { URL.revokeObjectURL(url); setStatus("No se pudo leer la imagen."); return; }
  showResult(await compose(img, img.naturalWidth, img.naturalHeight, false)); URL.revokeObjectURL(url);
});

/* Guardar / compartir */
const fileName = () => `${CONFIG.expo.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${styleId}-${format}.jpg`;
$("save").addEventListener("click", () => {
  if (!lastBlob) return; const a = document.createElement("a"); a.href = result.src; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
  setStatus("Si no se descargó, mantén presionada la imagen para guardarla.");
});
$("share").addEventListener("click", async () => {
  if (!lastBlob) return; const file = new File([lastBlob], fileName(), { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: CONFIG.expo }); setStatus("Elige Instagram en el menú de compartir."); } catch (e) {} }
  else setStatus("Tu navegador no comparte archivos directamente. Guarda la foto y súbela desde Instagram.");
});
$("again").addEventListener("click", () => {
  result.hidden = true; overlay.hidden = false; video.hidden = false;
  $("liveControls").hidden = false; $("liveActions").hidden = false; $("styles").hidden = false; $("resultActions").hidden = true;
  setStatus(""); startCamera(); sizeOverlay();
});
function setStatus(t) { $("status").textContent = t; }
startCamera();
</script>
</body>
