/* Dibuja la firma con ancho w, anclada según align (left|center|right) en (x,y) = esquina inferior, en el color dado */
function sign(ctx, x, y, w, color, align = "left", angle = 0) {
  if (!SIG.complete || !SIG.naturalWidth) return;
  const h = w * SIG.naturalHeight / SIG.naturalWidth;
  const off = document.createElement("canvas"); off.width = Math.ceil(w); off.height = Math.ceil(h);
  const o = off.getContext("2d"); o.drawImage(SIG, 0, 0, w, h); o.globalCompositeOperation = "source-in"; o.fillStyle = color; o.fillRect(0, 0, w, h);
  const dx = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
  ctx.save(); ctx.translate(dx + w / 2, y - h / 2); ctx.rotate(angle); ctx.drawImage(off, -w / 2, -h / 2); ctx.restore();
}


/* Pie común de los marcos temáticos: firma dentro de la foto (abajo a la derecha) y textos en la banda inferior */
function footer(ctx, W, H, m, bot, c1, c2, sigColor) {
  const s = W / 1080;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10 * s; sign(ctx, W - m - 28 * s, bot - 28 * s, 230 * s, sigColor, "right"); ctx.restore();
  ctx.fillStyle = c1; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  stack(ctx, CONFIG.expoLines.map(l => l.toUpperCase()), m, bot + 235 * s, W - 2 * m, "Cormorant Garamond", 72 * s, 600, "", .96);
  ctx.font = font("IBM Plex Sans", 28 * s, 500); ctx.fillText(CONFIG.date, m, bot + 300 * s);
  ctx.fillStyle = c2; const f = `${CONFIG.place} · ${CONFIG.handle}`; fit(ctx, f, W - 2 * m, "IBM Plex Sans", 22 * s); ctx.fillText(f, m, bot + 345 * s);
}

/* ---------- Estilos de marco. Cada uno dibuja sobre un canvas de W×H (la foto ya está debajo). ---------- */
/* Escribe varias líneas (ajusta el tamaño para que la más ancha quepa en maxW) */
function stack(ctx, lines, x, y, maxW, fam, size, w = 400, it = "", lh = 1.0) {
  let f = size; ctx.font = font(fam, f, w, it);
  while (Math.max(...lines.map(l => ctx.measureText(l).width)) > maxW && f > 12) { f -= 2; ctx.font = font(fam, f, w, it); }
  lines.forEach((l, i) => ctx.fillText(l, x, y - (lines.length - 1 - i) * f * lh));
  return f;
}

/* Utilidades de overlay: la foto ocupa TODO el 9:16; el marco solo pinta encima (borde, textos, firma). */
function fadeBottom(ctx, W, H, h, color) {   // sombra inferior para que el texto lea sobre cualquier foto
  const g = ctx.createLinearGradient(0, H - h, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, color);
  ctx.fillStyle = g; ctx.fillRect(0, H - h, W, h);
}
function caption(ctx, W, H, opts) {        // título en 3 líneas + fecha + lugar, anclados abajo-izquierda sobre la foto
  const s = W / 1080, m = opts.m, c1 = opts.c1, c2 = opts.c2;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 12 * s;
  ctx.fillStyle = c1; const B = 300 * s;   // zona reservada abajo para los botones
  stack(ctx, CONFIG.expoLines.map(l => opts.upper ? l.toUpperCase() : l), m, H - B - 90 * s, W * .62, opts.fam, opts.size * s, opts.weight, opts.italic || "", .95);
  ctx.font = font("IBM Plex Sans", 26 * s, 500); ctx.fillText(CONFIG.date, m, H - B - 42 * s);
  ctx.fillStyle = c2; const f = `${CONFIG.place} · ${CONFIG.handle}`; fit(ctx, f, W - 2 * m, "IBM Plex Sans", 21 * s); ctx.fillText(f, m, H - B - 6 * s);
  ctx.restore();
  // firma abajo a la derecha
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 10 * s; sign(ctx, W - m, H - 300 * s - 90 * s, 230 * s, opts.sig || c1, "right"); ctx.restore();
}
function edgeClip(ctx, W, H, m) {          // recorta a la franja del borde (m px) para no pintar sobre la foto
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(m, m, W - 2 * m, H - 2 * m); ctx.clip("evenodd");
}

/* Preview en vivo */
/* ¿La señal viene acostada (iPhone)? Entonces se usa girada 90°: el cuadro completo de la cámara, en vertical. */
let ROT_DIR = 0; try { ROT_DIR = Number(localStorage.getItem("rotdir")) || 0; } catch (e) {}
function feedRotated() { return ROT_DIR !== 0 && video.videoWidth > video.videoHeight; }
function setRotDir(d) { ROT_DIR = d; try { localStorage.setItem("rotdir", String(d)); } catch (e) {} sizeOverlay(); }
function layoutVideo() {
  const rect = stage.getBoundingClientRect(), vw = rect.width, vh = rect.height;
  if (!video.videoWidth) { Object.assign(video.style, { width: vw + "px", height: vh + "px" }); return; }
  const rot = feedRotated(); video.classList.toggle("rot", rot && ROT_DIR > 0); video.classList.toggle("rotneg", rot && ROT_DIR < 0); $("rotBtn").hidden = !(video.videoWidth > video.videoHeight);
  // dimensiones de la imagen tal como se verá (si rota, ancho↔alto)
  const iw = rot ? video.videoHeight : video.videoWidth, ih = rot ? video.videoWidth : video.videoHeight;
  const k = Math.max(vw / iw, vh / ih);                     // cover sobre el visor
  const dw = iw * k, dh = ih * k;                           // tamaño visual
  // el elemento <video> se dimensiona en su propio eje (antes de rotar): si rota, width/height se intercambian
  Object.assign(video.style, rot ? { width: dh + "px", height: dw + "px" } : { width: dw + "px", height: dh + "px" });
}
function sizeOverlay() {
  layoutVideo();
  const rect = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  overlay.width = Math.round(rect.width * dpr); overlay.height = Math.round(rect.height * dpr);
  const ctx = overlay.getContext("2d"); ctx.clearRect(0, 0, overlay.width, overlay.height);
  // El marco se dibuja sobre TODO el visor con su proporción real (la pantalla): lo que ves es lo que sale.
  STYLES[styleId].draw(ctx, overlay.width, overlay.height);
}
window.addEventListener("resize", sizeOverlay);
sizeOverlay();
if (document.fonts) { document.fonts.ready.then(sizeOverlay); ["Permanent Marker", "Anton", "Caveat", "Cormorant Garamond"].forEach(f => document.fonts.load(`40px "${f}"`).then(sizeOverlay)); }

/* Cámara */
async function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices?.getUserMedia) { hint.textContent = "Este navegador no permite la cámara en vivo. Usa “Subir foto”."; return; }
  try {
    // Pedimos un encuadre 4:3 (el sensor completo, el mayor campo de visión posible): en iPhone el 16:9
    // recorta arriba y abajo y luego hay que ampliarlo para llenar la pantalla vertical, y eso se nota como zoom.
    // Pedimos a la cámara un cuadro VERTICAL (retrato) de forma escalonada: primero exacto, luego ideal, luego lo que haya.
    const attempts = [
      { facingMode: facing, width: { exact: 1080 }, height: { exact: 1920 } },
      { facingMode: facing, width: { exact: 720 }, height: { exact: 1280 } },
      { facingMode: facing, aspectRatio: { exact: 9 / 16 } },
      { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 }, aspectRatio: { ideal: 9 / 16 } },
      { facingMode: facing }
    ];
    stream = null;
    for (const v of attempts) { try { stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false }); break; } catch (e) {} }
    if (!stream) throw new Error("no camera");
    try {
      const track = stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom && caps.zoom.min < 1) await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
    } catch (e2) {}
    video.srcObject = stream; video.classList.toggle("mirror", facing === "user"); await video.play();
    // esperar a que el video tenga dimensiones reales antes de habilitar la captura
    await new Promise(res => { if (video.videoWidth) return res(); video.onloadedmetadata = () => res(); setTimeout(res, 1500); });
    sizeOverlay(); video.onresize = sizeOverlay; video.onloadedmetadata = sizeOverlay;
    hint.hidden = true; $("shoot").disabled = false;
    if (location.search.includes("debug")) { const r = stage.getBoundingClientRect(); setStatus(`video ${video.videoWidth}×${video.videoHeight} · visor ${Math.round(r.width)}×${Math.round(r.height)} · pantalla ${screen.width}×${screen.height} · salida ${outSize().join("×")}`); }
  } catch (e) { hint.hidden = false; hint.textContent = "No se pudo abrir la cámara. Revisa el permiso del navegador o usa “Subir foto”."; $("shoot").disabled = true; }
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
$("rotBtn").addEventListener("click", () => setRotDir(ROT_DIR === 0 ? 1 : ROT_DIR === 1 ? -1 : 0));
$("flip").addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; startCamera(); });

/* Captura: foto recortada al formato + marco encima */
function outSize() {   // 1080 de ancho; alto según la proporción de la pantalla (acotado entre 16:9 y 9:19.5 de Instagram)
  const rect = stage.getBoundingClientRect(); const ratio = Math.min(2.17, Math.max(1.5, rect.height / rect.width));
  return [1080, Math.round(1080 * ratio / 2) * 2];
}
function drawCover(ctx, src, sw, sh, W, H, mirror, rotate) {   // recorte idéntico al visor (cover), con giro si la señal viene acostada
  ctx.save();
  if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  if (rotate) {
    // imagen vista: ancho=sh, alto=sw. Cover sobre W×H.
    const iw = sh, ih = sw, k = Math.max(W / iw, H / ih), dw = iw * k, dh = ih * k;
    ctx.translate(W / 2, H / 2); ctx.rotate(ROT_DIR * Math.PI / 2);
    // tras rotar 90°, el eje x del canvas corresponde al alto visual: dibujamos la fuente sin girar con tamaño dh×dw
    ctx.drawImage(src, -dh / 2, -dw / 2, dh, dw);
  } else {
    const k = Math.max(W / sw, H / sh), cw = W / k, ch = H / k, cx = (sw - cw) / 2, cy = (sh - ch) / 2;
    ctx.drawImage(src, cx, cy, cw, ch, 0, 0, W, H);
  }
  ctx.restore();
}
function compose(src, sw, sh, mirror) {
  const [W, H] = outSize();
  const c = document.createElement("canvas"); c.width = W; c.height = H; const ctx = c.getContext("2d");
  drawCover(ctx, src, sw, sh, W, H, mirror, feedRotated()); STYLES[styleId].draw(ctx, W, H);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}
function composeFile(src, sw, sh) {
  const [W, H] = outSize();
  const c = document.createElement("canvas"); c.width = W; c.height = H; const ctx = c.getContext("2d");
  drawCover(ctx, src, sw, sh, W, H, false, false); STYLES[styleId].draw(ctx, W, H);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.92));
}
function showResult(blob) {
  lastBlob = blob; if (result.src) URL.revokeObjectURL(result.src); result.src = URL.createObjectURL(blob);
  result.hidden = false; overlay.hidden = true; video.hidden = true; hint.hidden = true;
  $("liveActions").hidden = true; $("topBar").hidden = true; $("resultActions").hidden = false;
  stopCamera(); setStatus("Lista para Instagram.");
}
$("shoot").addEventListener("click", async () => { if (video.videoWidth) showResult(await compose(video, video.videoWidth, video.videoHeight, facing === "user")); });
$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return; setStatus("Procesando…");
  // Se decodifica con <img>: funciona en todos los navegadores y respeta la orientación EXIF de la cámara
  const url = URL.createObjectURL(f);
  const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
  e.target.value = "";
  if (!img) { URL.revokeObjectURL(url); setStatus("No se pudo leer la imagen."); return; }
  showResult(await composeFile(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(url);
});

/* Guardar / compartir */
const fileName = () => `${CONFIG.expo.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${styleId}.jpg`;
$("save").addEventListener("click", () => {
  if (!lastBlob) return; const a = document.createElement("a"); a.href = result.src; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
  setStatus("Si no se descargó, mantén presionada la imagen para guardarla.");
});
$("share").addEventListener("click", async () => {
  if (!lastBlob) return; const file = new File([lastBlob], fileName(), { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: CONFIG.expo }); setStatus("Elige Instagram en el menú de compartir."); } catch (e) {} }
  else setStatus("Tu navegador no comparte archivos directamente. Guarda la foto y súbela desde Instagram.");
});
$("again").addEventListener("click", () => {
  result.hidden = true; overlay.hidden = false; video.hidden = false;
  $("liveActions").hidden = false; $("topBar").hidden = false; $("resultActions").hidden = true;
  setStatus(""); startCamera(); sizeOverlay();
});
function setStatus(t) { $("status").textContent = t; }
startCamera();
</script>
</body>
</html>
